name: reproduce-the-numbers

# Mechanical first pass of the review in PUBLISHING.md. A pull request re-derives only the numbers it
# could have affected: the instrument control plus the studies whose files it changed. The full
# manifest is reproduced by reproduce-all-nightly.yml.

on:
  pull_request:
    branches: [contrib, main]

concurrency:
  group: reproduce-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    # Most PRs select a small subset and finish in seconds. A long-lived science branch that touches
    # many study dirs (without shared-infra) can still select dozens of non-slow checks; 60m timed out
    # on PR #739 (~89 selected). Budget matches reproduce-all-nightly's order of magnitude.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt

      - name: List changed files
        run: git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" > changed.txt && cat changed.txt

      - name: Reproduce the numbers this PR could affect
        env:
          PYPHI_WELCOME_OFF: "true"
        run: python ci/reproduce.py --changed-file changed.txt
